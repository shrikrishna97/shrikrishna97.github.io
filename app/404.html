<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — Shri Krishna</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #0d1b2a;
        color: #e0e0e0;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card-404 {
        background: #1e3a5f;
        border: 1px solid rgba(0,180,216,0.3);
        border-radius: 12px;
        padding: 48px 40px 40px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        box-shadow: 0 8px 40px rgba(0,180,216,0.15);
      }
      .card-404 .code { font-size: 5rem; font-weight: bold; color: #00b4d8; line-height: 1; }
      .card-404 h1 { font-size: 1.5rem; margin: 14px 0 10px; color: #fff; }
      .card-404 p { color: #90a4ae; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
      .card-404 a {
        display: inline-block;
        background: #00b4d8;
        color: #0d1b2a;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 0.95rem;
        transition: background 0.2s, color 0.2s;
      }
      .card-404 a:hover { background: #2563eb; color: #fff; }
    </style>
  </head>
  <body>
    <div class="card-404">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>Oops! The page you're looking for doesn't exist or may have moved.<br>Let's get you back on track.</p>
      <a href="../index.html">← Back to Portfolio</a>
    </div>
  </body>
</html>
